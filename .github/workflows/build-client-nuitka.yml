name: Build Client (Nuitka)

# 第二套打包方案：Nuitka（把 Python 编译成原生 exe，冷启动比 cx_Freeze 快）。
# 构建过程与 build-client-release.yml（cx_Freeze）互相独立，发布则与它共用同一个
# Beta 预发布 / 正式 Release，只靠文件名区分：
#     cx_Freeze  → TPMSmartCard-cxfree-<beta|v版本>-win10-x64-green.zip / -setup.exe
#     Nuitka     → TPMSmartCard-nuitka-<beta|v版本>-win10-x64-green.zip / -setup.exe
#   · 产物目录 build/nuitka/（cx_Freeze 那条线的 build/exe.win-amd64-* 不动）；
#   · 安装包复用 install.iss / Builds\Build-Installer.ps1，只把 TPMSMART_BUILDDIR
#     指到 build\nuitka\TPMSmartCard（Program Files、卸载器、.tsb 关联等定义都不变）；
#   · 已存在的 Release 只往里追加资产，不改标题与说明（gh 的 run_number 是各工作流
#     独立计数的，说明文字也由 cx_Freeze 那条线维护，改回去只会互相覆盖）；
#   · 不参与 install.aip（Advanced Installer 工程仍指向 cx_Freeze 的产物目录）。
#
# 触发方式：
#   · 推送改动本方案的文件到 main（paths 过滤，避免每次提交都跑完整原生编译，
#     想让每次推送都产出 Nuitka 包就删掉 paths 过滤）→ 发布到 beta；
#   · 手动 workflow_dispatch（可选发布通道：beta / release / none）。
on:
  push:
    branches: [ main ]
    paths:
      - 'BuildNuitka.py'
      - 'requirements-nuitka.txt'
      # 安装包也由本流水线产出，改这些文件时一并重建
      - 'install.iss'
      - 'Builds/Ensure-InnoSetup.ps1'
      - 'Builds/Build-Installer.ps1'
      - 'Builds/Sign-Windows.ps1'
      - '.github/workflows/build-client-nuitka.yml'
  workflow_dispatch:
    inputs:
      channel:
        description: '发布目标：beta = 滚动预发布版；release = 正式版；none = 只构建不发布'
        type: choice
        options: [ beta, release, none ]
        default: beta
      version:
        description: '版本号（channel=release 时必填，例如 1.6.0 或 v1.6.2026.1012）'
        required: false
        type: string
      draft:
        description: 'channel=release 且 Release 还不存在时，以草稿方式创建'
        required: false
        type: boolean
        default: false
      targets:
        description: '只构建部分入口：app,web,certimport（留空 = 全部）'
        required: false
        type: string

permissions:
  contents: write

# 与 cx_Freeze 流水线共用同一批 Certum 云签名凭据（三个都配齐才签名）
env:
  CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
  CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
  CERTUM_CERTIFICATE_SHA1: ${{ secrets.CERTUM_CERTIFICATE_SHA1 }}

concurrency:
  # 推送触发的 beta 构建只保留最新一次；手动发布单独分组，避免被取消
  group: ${{ github.event_name == 'push' && 'client-nuitka-beta-build' || 'client-nuitka-release-build' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  # 解析发布目标与版本号。刻意不像 cx_Freeze 那条线那样检查「Release 是否已存在」：
  # Nuitka 产物是往同一个 Release 里追加资产，正常情况下那个 Release 本来就已经
  # 由 Build Client Release 建好了。
  prepare:
    name: Resolve target
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.resolve.outputs.channel }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          channel="$INPUT_CHANNEL"
          if [[ "$EVENT" == "push" || -z "$channel" ]]; then
            channel="beta"
          fi

          if [[ "$channel" != "release" ]]; then
            # beta：滚动预发布，版本号由 Module/Version.py 决定；none：只构建不发布
            echo "channel=$channel" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "tag=beta" >> "$GITHUB_OUTPUT"
            echo "target: $channel"
            exit 0
          fi

          version="${INPUT_VERSION#v}"
          version="${version#V}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::版本号格式不正确：${INPUT_VERSION}（应形如 1.6.0 或 1.6.2026.1012）"
            exit 1
          fi

          echo "channel=release" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "target: release v$version"

  build:
    name: Build Windows x64 (Nuitka)
    needs: prepare
    runs-on: windows-latest
    outputs:
      artifact: ${{ steps.pack.outputs.artifact }}
      package: ${{ steps.pack.outputs.package }}
      setup: ${{ steps.iscc.outputs.setup }}
    env:
      # Nuitka 是纯 Python（py3-none-any），不依赖 cx_Freeze，可以跟到官方最高支持的 3.14
      PYTHON_VERSION: '3.14'
      # runner 控制台是 cp1252，显式 UTF-8 输出，避免中文日志变乱码
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Certum signing secrets
        id: signing
        shell: pwsh
        run: |
          if ($env:CERTUM_CERTIFICATE_SHA1 -and $env:CERTUM_OTP_URI -and $env:CERTUM_USERNAME) {
            "TPMSMART_SIGN_ENABLED=1" >> $env:GITHUB_ENV
            "TPMSMART_SIGN_REQUIRED=1" >> $env:GITHUB_ENV
            Write-Host "Certum 云签名已启用（证书指纹 $env:CERTUM_CERTIFICATE_SHA1）"
          } else {
            "TPMSMART_SIGN_ENABLED=0" >> $env:GITHUB_ENV
            Write-Host "::warning title=未启用代码签名::缺少 CERTUM_USERNAME / CERTUM_OTP_URI / CERTUM_CERTIFICATE_SHA1 Secrets，本次产物不带数字签名"
          }

      - name: Ensure OpenSC installer
        shell: pwsh
        env:
          MSI_NAME: 'OpenSC-0.25.1_win64-Light.msi'
          MSI_URL: 'https://github.com/OpenSC/OpenSC/releases/download/0.25.1/OpenSC-0.25.1_win64-Light.msi'
          MSI_SHA256: '3FD9CABDF54AD1D757E49D5B33CC5834A2186D8E67B0F4DCBD5882E02D6A3EB0'
        run: |
          # OpenSC\ 整个目录会随程序分发（程序里的工具、安装时的 MSI 都从这里取），
          # 仓库里可能没有它（*.msi 被全局 gitignore 挡住），缺失时下载同一份并校验
          $target = Join-Path 'OpenSC' $env:MSI_NAME
          if (Test-Path $target) {
            $hash = (Get-FileHash $target -Algorithm SHA256).Hash
            if ($hash -eq $env:MSI_SHA256) {
              Write-Host "found $target (sha256 ok)"
            } else {
              Write-Host "WARNING: $target sha256 = $hash (expected $env:MSI_SHA256)"
            }
            exit 0
          }

          New-Item -ItemType Directory -Force -Path 'OpenSC' | Out-Null
          Write-Host "not found in repo, downloading $env:MSI_URL"
          Invoke-WebRequest -Uri $env:MSI_URL -OutFile $target -UseBasicParsing -TimeoutSec 300

          $hash = (Get-FileHash $target -Algorithm SHA256).Hash
          if ($hash -ne $env:MSI_SHA256) {
            Remove-Item $target -Force -ErrorAction SilentlyContinue
            throw "OpenSC msi sha256 mismatch: expected $env:MSI_SHA256, got $hash"
          }
          Write-Host "downloaded $target ($([math]::Round((Get-Item $target).Length / 1MB, 2)) MB)"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-nuitka.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-nuitka.txt

      # cx_Freeze / Nuitka 对缺失模块都只告警，产物要到运行那一行才报
      # ModuleNotFoundError，所以先确认 requirements.txt 覆盖了项目里全部 import
      - name: Check declared dependencies
        run: python Builds/check_imports.py

      - name: Resolve package name
        id: naming
        shell: pwsh
        env:
          INPUT_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $version = "$env:INPUT_VERSION".Trim() -replace '^[vV]', ''

          # exe 版本资源与安装包的 VersionInfoVersion 必须是 4 段数字，缺位补 0
          $version4 = '1.6.0.0'
          if (-not [string]::IsNullOrWhiteSpace($version)) {
            $parts = @($version -split '\.')
            while ($parts.Count -lt 4) { $parts += '0' }
            $version4 = ($parts[0..3] -join '.')
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "version4=$version4" >> $env:GITHUB_OUTPUT

          # 产物基础名：TPMSmartCard-<打包方式>-<通道>-<系统>-<架构>（与 cx_Freeze 那条线同一套规则）
          # 基础名之后由具体产物补后缀：绿色版 -green.zip、安装包 -setup.exe
          # 例：TPMSmartCard-nuitka-beta-win10-x64-green.zip / -setup.exe
          if ([string]::IsNullOrWhiteSpace($version)) {
            "name=TPMSmartCard-nuitka-beta-win10-x64" >> $env:GITHUB_OUTPUT
          } else {
            "name=TPMSmartCard-nuitka-v$version-win10-x64" >> $env:GITHUB_OUTPUT
          }

      # Nuitka 会把编译过的 C 模块缓存起来（默认在 %LOCALAPPDATA%\Nuitka），
      # 缓存命中后重复构建能省掉大半时间
      - name: Cache Nuitka compilation
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-windows-py311-${{ hashFiles('requirements-nuitka.txt', 'BuildNuitka.py') }}
          restore-keys: |
            nuitka-windows-py311-

      # ---- Certum 云签名环境（与 cx_Freeze 流水线同一套脚本）----------------
      - name: Setup Certum SimplySign
        if: env.TPMSMART_SIGN_ENABLED == '1'
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File Builds/Sign-SetupCertum.ps1 -Install -ConfigureRegistry

      - name: Authenticate Certum
        if: env.TPMSMART_SIGN_ENABLED == '1'
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            pwsh -NoProfile -ExecutionPolicy Bypass -File Builds/Sign-SetupCertum.ps1 -Connect -Verify
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Certum 认证第 $attempt 次失败，10 秒后重试"
            Start-Sleep -Seconds 10
          }
          throw 'Certum 云签名认证失败（3 次重试都没能把云证书挂到证书库）'

      # 编译三个入口（主程序 + WEB + 证书导入）并合并成 build/nuitka/TPMSmartCard，
      # 原生编译比较慢（CI 上通常 20~40 分钟），但产物冷启动明显快于 cx_Freeze
      - name: Build with Nuitka
        shell: pwsh
        env:
          TPMSMART_VERSION: ${{ steps.naming.outputs.version }}
          TARGETS: ${{ inputs.targets }}
        run: |
          $nuitkaArgs = @()
          if (-not [string]::IsNullOrWhiteSpace($env:TARGETS)) {
            $nuitkaArgs += @('--targets', $env:TARGETS)
          }
          $watch = [System.Diagnostics.Stopwatch]::StartNew()
          python BuildNuitka.py @nuitkaArgs
          $code = $LASTEXITCODE
          $watch.Stop()
          Write-Host ("Nuitka 构建用时 {0:N1} 分钟" -f $watch.Elapsed.TotalMinutes)
          if ($code -ne 0) { throw "Nuitka 构建失败（退出码 $code）" }

      # 冒烟测试：从 C:\ 启动 WEB 入口（故意用「非程序目录」的工作目录，模拟双击
      # .tsb / 开机自启的场景），要求它靠 Module/Paths.py 自己切回产物目录并渲染出
      # 上传页。这一步能一次性发现 Nuitka 漏收的隐藏依赖、缺失的数据文件
      # （templates/locales/ttkbootstrap 主题）以及程序根目录判定错误。
      - name: Smoke test (WEB exe from a foreign working directory)
        shell: pwsh
        run: |
          $dist = Join-Path $PWD 'build/nuitka/TPMSmartCard'
          $exe = Join-Path $dist 'SmartCardWEB.exe'
          if (-not (Test-Path $exe)) {
            Write-Host "::warning title=跳过冒烟测试::本次构建未包含 web 入口（--targets 里没有 web）"
            exit 0
          }

          $out = Join-Path $env:TEMP 'nuitka-smoke.out.txt'
          $err = Join-Path $env:TEMP 'nuitka-smoke.err.txt'
          Remove-Item $out, $err -Force -ErrorAction SilentlyContinue

          $proc = Start-Process -FilePath $exe -WorkingDirectory 'C:\' -PassThru `
              -RedirectStandardOutput $out -RedirectStandardError $err

          $url = 'http://127.0.0.1:1080/web/cert'
          $ok = $false
          try {
            $deadline = (Get-Date).AddSeconds(90)
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 2
              if ($proc.HasExited) { break }
              try {
                $resp = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 5
                if ($resp.StatusCode -eq 200) { $ok = $true; break }
              } catch { }
            }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            Get-Process -Name 'SmartCardWEB' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            # 程序启动时会自行 mkdir Caches（证书缓存），测试留下的空目录不进产物
            Remove-Item -LiteralPath (Join-Path $dist 'Caches') -Recurse -Force -ErrorAction SilentlyContinue
          }

          if ($ok) {
            Write-Host "冒烟测试通过：$url 返回 200（程序根目录、模板与数据文件都正常）"
            exit 0
          }

          Write-Host '--- stdout ---'
          Get-Content $out -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
          Write-Host '--- stderr ---'
          Get-Content $err -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
          throw "冒烟测试失败：$url 未返回 200（产物可能缺少隐藏依赖，或程序根目录判定不正确）"

      - name: Package (portable zip)
        id: pack
        shell: pwsh
        env:
          NAME: ${{ steps.naming.outputs.name }}
        run: |
          $name = $env:NAME
          $buildDir = Join-Path $PWD 'build/nuitka/TPMSmartCard'
          if (-not (Test-Path $buildDir)) { throw "Nuitka output directory not found: $buildDir" }

          $stage = Join-Path 'staging' $name
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path (Join-Path $buildDir '*') -Destination $stage -Recurse -Force

          # 主程序 exe 在 BuildNuitka.py 里已经签好名，这里只补 Import 组件的副本
          # （仓库里的 Import\ 保持原样，不就地签名）
          if ($env:TPMSMART_SIGN_ENABLED -eq '1') {
            $importTargets = @(Get-ChildItem -Path (Join-Path $stage 'Import') -File -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -in @('TPMImport.exe', 'TPMImport.dll') } |
                ForEach-Object { $_.FullName })
            if ($importTargets.Count) {
              & (Join-Path $PWD 'Builds/Sign-Windows.ps1') -Path ($importTargets -join ';')
              if ($LASTEXITCODE -ne 0) { throw "signing Import components failed ($LASTEXITCODE)" }
            }
          }

          New-Item -ItemType Directory -Force -Path 'dist' | Out-Null
          # absolute path: 7-Zip runs with the staging directory as working directory
          $zip = Join-Path $PWD "dist/$name-green.zip"

          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          if (Test-Path $sevenZip) {
            Push-Location 'staging'
            & $sevenZip a -tzip -mx=9 $zip $name
            $code = $LASTEXITCODE
            Pop-Location
            if ($code -ne 0) { throw "7-Zip failed with exit code $code" }
          } else {
            Compress-Archive -Path $stage -DestinationPath $zip -CompressionLevel Optimal
          }

          $size = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Host "created $name-green.zip ($size MB)"

          "artifact=$name" >> $env:GITHUB_OUTPUT
          "package=$name-green.zip" >> $env:GITHUB_OUTPUT

      # 安装包：完整复用 cx_Freeze 那条线的 install.iss（安装到 Program Files、卸载器、
      # VC++ 运行库 / OpenSC 依赖、.tsb 文件关联都不变），唯一的差别是把产物目录指向
      # Nuitka 的 standalone 目录，产物名带 -nuitka- 前缀以便与 cx_Freeze 的安装包共存
      - name: Build installer (Inno Setup)
        id: iscc
        shell: pwsh
        env:
          TPMSMART_VERSION: ${{ steps.naming.outputs.version }}
          TPMSMART_VERSION4: ${{ steps.naming.outputs.version4 }}
          TPMSMART_PACKAGENAME: ${{ steps.naming.outputs.name }}
        run: |
          # install.iss 用 GetEnv("TPMSMART_BUILDDIR") 取产物目录（相对路径以 .iss 为准，
          # 这里给绝对路径最稳），Build-Installer.ps1 与 ISCC 子进程都会继承它
          $env:TPMSMART_BUILDDIR = Join-Path $PWD 'build/nuitka/TPMSmartCard'

          $lines = & (Join-Path $PWD 'Builds/Ensure-InnoSetup.ps1')
          $iscc = $lines | Where-Object { $_ -match 'ISCC\.exe$' } | Select-Object -Last 1
          if (-not $iscc -or -not (Test-Path $iscc)) { throw 'ISCC.exe not found' }

          # Build-Installer.ps1 负责：解析 signtool + Certum 云证书、先把 Import 组件签好、
          # 再用 ISCC /S 注入签名工具（安装包与卸载器也会被签），无证书时就是不签名
          & (Join-Path $PWD 'Builds/Build-Installer.ps1') -Iscc $iscc
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compile failed ($LASTEXITCODE)" }

          $setup = Get-ChildItem 'dist' -Filter '*-setup.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setup) { throw 'installer executable was not produced' }
          Write-Host ("created {0} ({1:N1} MB)" -f $setup.Name, ($setup.Length / 1MB))
          "setup=$($setup.Name)" >> $env:GITHUB_OUTPUT

      # 签名兜底校验：确认产物真的由那张 Certum 云证书签了名，避免「构建成功但
      # 产物没签上」被静默发布
      - name: Verify signatures
        if: env.TPMSMART_SIGN_ENABLED == '1'
        shell: pwsh
        env:
          NAME: ${{ steps.naming.outputs.name }}
        run: |
          $expected = ($env:CERTUM_CERTIFICATE_SHA1 -replace '[^0-9a-fA-F]', '').ToUpperInvariant()
          $targets = @(Get-ChildItem -Path (Join-Path 'staging' $env:NAME) -Filter '*.exe' -File -ErrorAction SilentlyContinue)
          $targets += @(Get-ChildItem -Path 'dist' -Filter '*-setup.exe' -File -ErrorAction SilentlyContinue)
          if (-not $targets.Count) { throw 'no signed artifacts found to verify' }

          $bad = @()
          foreach ($file in $targets) {
            $sig = Get-AuthenticodeSignature -LiteralPath $file.FullName
            $thumb = if ($sig.SignerCertificate) { ($sig.SignerCertificate.Thumbprint -replace '[^0-9a-fA-F]', '').ToUpperInvariant() } else { '' }
            $ok = ($thumb -eq $expected) -and ($sig.Status -eq 'Valid')
            Write-Host ("{0,-40} {1,-12} {2}" -f $file.Name, $sig.Status, $thumb)
            if (-not $ok) { $bad += $file.FullName }
          }
          if ($bad.Count) {
            throw ("以下产物签名不正确（期望指纹 $expected）：`n" + ($bad -join "`n"))
          }
          Write-Host "全部 $($targets.Count) 个产物的签名校验通过"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # 与 cx_Freeze 共用同一批 Release：beta 是滚动预发布标签，release 是 v<版本>；
  # 两边各传各的产物，只靠文件名区分。已存在的 Release 只追加资产，不改标题与说明
  # （gh 的 run_number 是各工作流各自计数的，说明文字也由 cx_Freeze 那条线维护）。
  publish:
    name: Publish (${{ needs.prepare.outputs.channel }})
    needs: [ prepare, build ]
    if: needs.prepare.outputs.channel != 'none'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - name: Upload Nuitka packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          DRAFT: ${{ inputs.draft }}
          PACKAGE: ${{ needs.build.outputs.package }}
          SETUP: ${{ needs.build.outputs.setup }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"

          # ---- 1) Release 不存在时兜底创建（正常情况下 cx_Freeze 那条线已经建好了）----
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            if [ "$CHANNEL" = "release" ]; then
              draft_flag=""
              if [ "${DRAFT}" = "true" ]; then draft_flag="--draft"; fi
              gh release create "$TAG" --repo "$REPO" --target "$GITHUB_SHA" $draft_flag \
                --title "V${VERSION} Release" \
                --notes "V${VERSION}：含 cx_Freeze 与 Nuitka 两套产物，按文件名区分。"
              echo "::warning title=Release 由本流水线创建::$TAG 通常应由 Build Client Release 创建；若之后还要用它发布 cx_Freeze 产物，那条线会因「Release 已存在」中止，需要先 gh release delete $TAG"
            else
              gh release create "$TAG" --repo "$REPO" --prerelease --target "$GITHUB_SHA" \
                --title "Beta Build #${{ github.run_number }}" \
                --notes "自动构建的 Beta 测试版（每次推送到 main 覆盖更新），含 cx_Freeze 与 Nuitka 两套产物，按文件名区分。"
            fi
          fi

          # ---- 2) 上传产物：文件名带 -nuitka-，与 cx_Freeze 的资产互不覆盖 ----
          # 允许重试：cx_Freeze 那条线在标签无法移动时会删掉 Release 重建，撞上时这次上传会失败
          for attempt in 1 2 3; do
            if gh release upload "$TAG" dist/* --repo "$REPO" --clobber; then
              echo "已把 $PACKAGE 与 $SETUP 上传到 $TAG"
              exit 0
            fi
            echo "上传失败（第 $attempt 次），5 秒后重试…"
            sleep 5
          done

          echo "::error::上传 Nuitka 产物到 $TAG 失败（3 次都没成功）"
          exit 1
