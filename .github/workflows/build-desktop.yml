name: build-desktop

# Go + Wails 桌面端构建矩阵：Windows / Linux / macOS × amd64 / arm64。
# 旧的 Python 流水线（build-client-*.yml）已移除，v1 代码归档在 legacy/。
on:
  workflow_call:
    inputs:
      version:
        description: "覆盖产物版本号（beta 流水线使用）"
        required: false
        type: string
        default: ""
    secrets:
      MACOS_CERT_P12:
        required: false
      MACOS_CERT_PASSWORD:
        required: false
      MACOS_SIGN_IDENTITY:
        required: false
      MACOS_NOTARY_PROFILE:
        required: false
      MACOS_NOTARY_APPLE_ID:
        required: false
      MACOS_NOTARY_TEAM_ID:
        required: false
      MACOS_NOTARY_PASSWORD:
        required: false
  workflow_dispatch:

# 注意：main 的日常构建由 beta-desktop.yml 负责。
# 这里不再监听 push，否则与 beta 通过 workflow_call 复用同一 concurrency 组，
# 两个 run 会互相取消（2026-11 实际踩过）。
concurrency:
  group: build-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # 供步骤里的 if 判断使用（GitHub 不允许直接在 if 中引用 secrets）
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            os: windows-latest
            goarch: amd64
            cgo: "0"
          - name: windows-arm64
            os: windows-latest
            goarch: arm64
            cgo: "0"
          - name: linux-amd64
            os: ubuntu-22.04
            goarch: amd64
            cgo: "1"
            webkit: "4.0"
          # Ubuntu 24.04 只提供 webkit2gtk-4.1，Wails 需加 webkit2_41 构建标签
          - name: linux-arm64
            os: ubuntu-24.04-arm
            goarch: arm64
            cgo: "1"
            webkit: "4.1"
            wails_tags: "desktop,webkit2_41"
          # macOS 13 runner 已进入退役流程，改用 macos-15-intel / macos-15
          - name: macos-amd64
            os: macos-15-intel
            goarch: amd64
            cgo: "1"
          - name: macos-arm64
            os: macos-15
            goarch: arm64
            cgo: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: |
            core/go.sum
            desktop/wails/go.sum
            Fido/src/fido-go/go.sum

      - name: 安装 Linux WebKit / GTK 依赖
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          if [ "${{ matrix.webkit }}" = "4.1" ]; then
            sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev pkg-config
          else
            sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev pkg-config
          fi

      - name: 安装依赖并构建前端
        run: |
          npm ci
          npm run build -w @tpmsc/web
          node scripts/prepare-ui.mjs

      - name: Go 单元测试
        working-directory: core
        run: go test ./...

      - name: 导入 macOS 签名证书（可选）
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 != ''
        shell: bash
        run: |
          set -euo pipefail
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p actions build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p actions build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k actions build.keychain
          security list-keychains -d user -s build.keychain \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: 构建桌面端
        working-directory: desktop/wails
        shell: bash
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOARCH: ${{ matrix.goarch }}
          TAGS: ${{ matrix.wails_tags || 'desktop' }}
          VERSION: ${{ inputs.version != '' && inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '2.0.0') }}
        run: |
          set -euo pipefail
          EXT=""
          if [ "${{ runner.os }}" = "Windows" ]; then EXT=".exe"; fi
          mkdir -p ../dist
          go build -tags "$TAGS" -trimpath \
            -ldflags "-s -w -X main.Version=${VERSION#v} -X main.Commit=${GITHUB_SHA::8}" \
            -o "../dist/TPMSmartCard${EXT}" .

      - name: 打包（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ inputs.version != '' && inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '2.0.0') }}
        run: |
          $version = $env:VERSION.TrimStart("v")
          $stage = "dist/TPMSmartCard-$version-windows-${{ matrix.goarch }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "desktop/dist/TPMSmartCard.exe" $stage
          Copy-Item README.md, LICENSE $stage
          if (Test-Path "legacy/OpenSC") {
            Copy-Item "legacy/OpenSC" (Join-Path $stage "OpenSC") -Recurse
          }
          Compress-Archive -Path "$stage/*" -DestinationPath "$stage.zip" -Force

      - name: 打包（Linux）
        if: runner.os == 'Linux'
        shell: bash
        env:
          VERSION: ${{ inputs.version != '' && inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '2.0.0') }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          STAGE="dist/TPMSmartCard-${VERSION}-linux-${{ matrix.goarch }}"
          mkdir -p "$STAGE/usr/bin" "$STAGE/usr/share/applications"
          cp desktop/dist/TPMSmartCard "$STAGE/usr/bin/"
          cp desktop/packaging/linux/tpmsmartcard.desktop "$STAGE/usr/share/applications/"
          cp legacy/Config/iconer/icon01.png "$STAGE/usr/share/applications/tpmsmartcard.png"
          tar -czf "$STAGE.tar.gz" -C dist "$(basename "$STAGE")"

      - name: 打包（macOS）
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          VERSION: ${{ inputs.version != '' && inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '2.0.0') }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          APP="dist/TPMSmartCard.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp desktop/dist/TPMSmartCard "$APP/Contents/MacOS/"
          cp desktop/packaging/macos/Info.plist "$APP/Contents/"
          cp desktop/packaging/macos/entitlements.plist "$APP/Contents/Resources/"

          if [ -n "${MACOS_SIGN_IDENTITY:-}" ]; then
            codesign --force --deep --options runtime \
              --entitlements desktop/packaging/macos/entitlements.plist \
              --sign "$MACOS_SIGN_IDENTITY" "$APP"
            if [ -n "${MACOS_NOTARY_PROFILE:-}" ]; then
              ditto -c -k --keepParent "$APP" "dist/notarize.zip"
              xcrun notarytool submit "dist/notarize.zip" --keychain-profile "$MACOS_NOTARY_PROFILE" --wait
              xcrun stapler staple "$APP"
              rm -f "dist/notarize.zip"
            elif [ -n "${MACOS_NOTARY_APPLE_ID:-}" ] && [ -n "${MACOS_NOTARY_PASSWORD:-}" ]; then
              ditto -c -k --keepParent "$APP" "dist/notarize.zip"
              xcrun notarytool submit "dist/notarize.zip" \
                --apple-id "$MACOS_NOTARY_APPLE_ID" \
                --team-id "$MACOS_NOTARY_TEAM_ID" \
                --password "$MACOS_NOTARY_PASSWORD" --wait
              xcrun stapler staple "$APP"
              rm -f "dist/notarize.zip"
            else
              echo "::warning::未配置公证凭据：产物已签名但未公证"
            fi
          else
            echo "::warning::未配置 MACOS_SIGN_IDENTITY：Secure Enclave 将降级为软件密钥"
          fi

          (cd dist && zip -qry "TPMSmartCard-${VERSION}-macos-${{ matrix.goarch }}.zip" TPMSmartCard.app)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  build-fido:
    name: fido-go-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: Fido/src/fido-go/go.sum
      - name: 构建 FIDO2 服务
        working-directory: Fido/src/fido-go
        run: go build -trimpath -ldflags "-s -w -H windowsgui" -o ../../../dist/fido-go.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: fido-go-windows
          path: dist/fido-go.exe
          if-no-files-found: error
