name: beta-desktop

# Rolling beta：main 每次通过构建后，把三平台双架构产物覆盖到 `beta` 预发布。
# 与 release-desktop.yml 的区别：beta 是移动标签，release 由版本标签冻结。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "desktop/**"
      - "web/**"
      - "packages/**"
      - "scripts/**"
      - "Fido/**"
      - ".github/workflows/beta-desktop.yml"
      - ".github/workflows/build-desktop.yml"

permissions:
  contents: write

concurrency:
  group: beta-desktop
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build-desktop.yml
    secrets: inherit
    with:
      # beta 通道固定用 beta 作为版本号，产物名不再带构建序号
      version: beta

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 更新 beta 预发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 该 job 没有 checkout，gh 无法从 git remote 推断仓库，必须显式指定
          GH_REPO: ${{ github.repository }}
          TAG: beta
          SHA: ${{ github.sha }}
          RUN: ${{ github.run_number }}
        run: |
          set -euo pipefail
          ls -lh artifacts
          NOTES=$(printf '自动构建 · 构建号 %s\n\n- 提交：`%s`\n- 产物：Windows / Linux / macOS × amd64 / arm64\n\n> 这是移动标签，只保留最新一次构建；稳定版本请使用 v2.x 正式 Release。' "$RUN" "$SHA")
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 只保留最新构建：先清空旧资产，再上传本次产物
            gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r name; do
              if [ -n "$name" ]; then
                gh release delete-asset "$TAG" "$name" -y || true
              fi
            done
            gh release upload "$TAG" artifacts/* --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" artifacts/* \
              --prerelease \
              --title "Beta（滚动构建）" \
              --notes "$NOTES"
          fi
