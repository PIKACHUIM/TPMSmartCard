name: Release

# 手动触发，填写版本号后发布正式 Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（可带或不带 v 前缀，例如 1.6 或 v1.6.2026.1012）'
        required: true
        type: string
      draft:
        description: '以草稿方式创建 Release（稍后手动公开）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Validate version
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION#v}"
          version="${version#V}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::版本号格式不正确：${INPUT_VERSION}（应形如 1.6 或 1.6.2026.1012）"
            exit 1
          fi
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "::error::Release v$version 已存在，请更换版本号或先删除旧 Release"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  publish:
    name: Publish release
    needs: [ prepare, build ]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail

          cat > notes.md <<EOF
          ## TPM 虚拟智能卡管理工具 V${VERSION}

          - 下载 \`${{ needs.build.outputs.package }}\`，解压后运行 \`SmartCardAPP.exe\`
          - 使用前请先安装 [OpenSC](https://github.com/OpenSC/OpenSC/releases)
          - 构建提交：\`$GITHUB_SHA\`
          - 构建流水线：[#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          EOF

          draft_flag=""
          if [[ "$DRAFT" == "true" ]]; then
            draft_flag="--draft"
          fi

          gh release create "$TAG" "dist/${{ needs.build.outputs.package }}" \
            --title "V${VERSION} Release" \
            --target "$GITHUB_SHA" \
            --notes-file notes.md \
            $draft_flag
