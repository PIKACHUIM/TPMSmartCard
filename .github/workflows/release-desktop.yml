name: release-desktop

# 打 v2.<序号> 标签（例如 v2.1）时构建三平台产物并创建 GitHub Release。
# 版本号只允许两段：v2.1，不接受 v2.1.0。
on:
  push:
    tags:
      - "v2.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的标签（两段，例如 v2.1）"
        required: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: 校验版本号格式（v2.<序号>）
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v2\.[0-9]+$ ]]; then
            echo "::error::版本标签必须是 v2.<序号>（例如 v2.1），当前为 $TAG"
            exit 1
          fi
          echo "版本：$TAG"

  build:
    needs: validate
    uses: ./.github/workflows/build-desktop.yml
    secrets: inherit
    with:
      version: ${{ github.event.inputs.tag || github.ref_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ls -lh artifacts
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* \
              --title "$TAG" \
              --generate-notes
          fi
