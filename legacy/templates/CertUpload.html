<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('web_title') }}</title>
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet"/>
</head>
<body>
<div class="lang-switch">
    <label for="lang">{{ t('web_lang') }}</label>
    <select id="lang" onchange="switchLanguage(this.value)">
        {% for code, name in languages %}
        <option value="{{ code }}"{% if code == lang %} selected{% endif %}>{{ name }}</option>
        {% endfor %}
    </select>
</div>
<div class="container">
    <div class="form-container">
        <form action="http://127.0.0.1:1080/put/cert"
              method="POST"
              enctype="multipart/form-data">
            <div>
                <div class="form-group">
                    <div>{{ t('web_pubkey') }}</div>
                    <input type="text" name="pubkey" required>
                </div>
                <div class="form-group">
                    <div>{{ t('web_pfxpass') }}</div>
                    <input type="text" name="pfxkey" required>
                </div>
                <div class="form-group">
                    <div>{{ t('web_certfile') }}</div>
                    <input type="file" name="vaults" required>
                </div>
                <div class="form-group">
                    <button type="submit">{{ t('web_submit') }}</button>
                </div>
            </div>
        </form>
    </div>
</div>
<script>
    function switchLanguage(code) {
        const url = new URL(window.location.href);
        url.searchParams.set('lang', code);
        window.location.href = url.toString();
    }
</script>
</body>
</html>
